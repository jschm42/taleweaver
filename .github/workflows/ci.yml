name: TaleWeaver CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install "poetry>=2.0.0"

    - name: Install dependencies
      run: |
        poetry install

    - name: Code Quality & Security Linting (Ruff)
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          poetry run python scripts/lint.py --changed "origin/${{ github.base_ref }}"
        elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          poetry run python scripts/lint.py --changed "${{ github.event.before }}"
        else
          poetry run python scripts/lint.py --changed "HEAD~1"
        fi

    - name: Type checking with mypy
      run: |
        poetry run mypy backend --ignore-missing-imports || true # Optional: remove || true once fully typed

    - name: Run Tests with pytest
      run: |
        # Ensure a tests directory exists or this step will fail natively.
        # We handle it gracefully in case it doesn't exist yet.
        if [ -d "backend/tests" ]; then
          poetry run pytest backend/tests/ -v
        elif [ -d "tests" ]; then
          poetry run pytest tests/ -v || true
        else
          echo "No tests directory found. Skipping tests."
        fi
