name: TaleWeaver CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install "poetry>=2.0.0"

    - name: Install dependencies
      run: |
        poetry install

    - name: Check Formatting with Black
      run: |
        poetry run black backend --check --line-length 120

    - name: Lint with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        poetry run flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        poetry run flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Type checking with mypy
      run: |
        poetry run mypy backend --ignore-missing-imports || true # Optional: remove || true once fully typed

    - name: Run Tests with pytest
      run: |
        # Ensure a tests directory exists or this step will fail natively.
        # We handle it gracefully in case it doesn't exist yet.
        if [ -d "backend/tests" ]; then
          poetry run pytest backend/tests/ -v
        elif [ -d "tests" ]; then
          poetry run pytest tests/ -v || true
        else
          echo "No tests directory found. Skipping tests."
        fi
