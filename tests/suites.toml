# Named test suites for scripts/run_tests.py.
#
#   poetry run python scripts/run_tests.py list          # suites + files in no suite
#   poetry run python scripts/run_tests.py run turn npc  # run suites
#
# `tests` are file-name globs inside tests/. A file may sit in several suites.
# `sources` are repo-relative path globs (`*` also matches `/`): a change to a matching
# file makes `affected` and the pre-push hook run the whole suite.
# New test files: add them to a suite (`list` shows the ones that are in none).

[suites.core]
description = "Quick smoke check of the critical paths"
tests = [
    "test_game_loop.py",
    "test_guardrails_behaviour.py",
    "test_security_hardening.py",
    "test_session_ownership.py",
    "test_adventure_lifecycle.py",
    "test_manifest_round_trip.py",
    "test_world_manifesto.py",
    "test_script_sandbox.py",
]
sources = [
    "backend/init_db.py",
    "backend/api/routes/data.py",
    "backend/api/routes/adventures/schemas.py",
    "backend/utils/text_utils.py",
    "backend/main.py",
    "backend/models/*",
    "backend/core/database.py",
    "backend/schemas/*",
    "backend/crud/*",
    "alembic/*",
]

