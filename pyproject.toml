[project]
name = "taleweaver"
version = "0.5.0"
description = "AI-powered text and role-playing adventure game engine"
authors = [
    {name = "Jean Schmitz"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "uuid6>=2024.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "litellm>=1.40.0",
    "alembic>=1.13.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "openai-whisper>=20250625",
]

[project.scripts]
taleweaver = "backend.main:start"

[tool.poetry]
packages = [{include = "backend"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.8.0"
mypy = ">=1.10.0"
black = ">=24.0.0"
flake8 = ">=7.0.0"
types-pillow = ">=10.0.0"
types-python-jose = ">=3.3.0"
types-cryptography = ">=3.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
# Target Python version
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "alembic",
    "backend/brain/*/scratch",
    "D:/_pyrefly_virtual_",
]

[tool.ruff.lint]
# Enable various linting rules
# E: pycodestyle errors
# F: Pyflakes
# B: flake8-bugbear
# I: isort
# N: pep8-naming
# UP: pyupgrade
# PL: Pylint
# C90: mccabe (complexity)
select = ["E", "F", "B", "I", "N", "UP", "PL", "C90"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/api/routes/adventures/gameplay_logic.py" = ["E501", "E701", "I001", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1714", "PLR2004"]
"backend/core/prompts.py" = ["E501"]
"tests/test_game_loop.py" = ["F811", "ARG001", "F841", "PLR0133"]
"scripts/*" = ["E501", "C901", "PLR0912", "PLR0915", "PLR2004", "E402", "PLC0415"]

# Allow fixable violations to be fixed automatically
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
python_version = "3.10"
exclude = [
    "venv",
    "alembic",
    "backend/brain/.*/scratch",
    "D:/_pyrefly_virtual_",
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "aiosqlite.*",
    "litellm.*",
    "alembic.*",
    "passlib.*",
    "jose.*"
]
ignore_missing_imports = true
