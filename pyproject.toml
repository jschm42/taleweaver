[project]
name = "taleweaver"
version = "0.5.0"
description = "AI-powered text and role-playing adventure game engine"
authors = [
    {name = "Jean Schmitz"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "uuid6>=2024.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "litellm>=1.88.6",
    "alembic>=1.13.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "faster-whisper (>=1.0.0)",
]

[project.scripts]
taleweaver = "backend.main:start"

[tool.poetry]
packages = [{include = "backend"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.8.0"
mypy = ">=1.10.0"
black = ">=26.10.1"
flake8 = ">=7.0.0"
types-pillow = ">=10.0.0"
types-python-jose = ">=3.3.0"
types-cryptography = ">=3.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
# Target Python version
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "alembic",
    "backend/brain/*/scratch",
    "D:/_pyrefly_virtual_",
]

[tool.ruff.lint]
# Selected rules focusing on Clean Code & Security:
# E, W: pycodestyle errors and warnings
# F: Pyflakes (clean imports, variables, syntax)
# B: flake8-bugbear (common design pitfalls and subtle bugs)
# I: isort (clean organized imports)
# N: pep8-naming (standard naming conventions)
# UP: pyupgrade (modern Python 3.10+ idioms)
# PL: Pylint (refactoring, complexity, clean patterns)
# C90: mccabe (cyclomatic complexity)
# S: flake8-bandit (security checks: injections, shell executions, unsafe deserialization)
# SIM: flake8-simplify (clean control flow, eliminating nested ifs and redundant boolean logic)
select = ["E", "W", "F", "B", "I", "N", "UP", "PL", "C90", "S", "SIM"]

# Streamlined ignores to eliminate noisy/superficial warnings and reduce false positives:
# E501: line-too-long (handled by ruff formatter / soft wrap)
# W291, W292, W293: whitespace and newline warnings (handled automatically by ruff format)
# B008: function-call-in-default-argument (standard FastAPI Depends/Query/Path pattern)
# PLR2004: magic-value-comparison (e.g. status == 200, len(x) == 3)
# PLC0415: import-outside-top-level (used for circular import avoidance in routers/plugins)
# UP045: non-pep604-annotation-optional (Optional[T] is standard and readable)
# S311: pseudo-random-generators (game mechanics, dice, and SVG generation; crypto uses Fernet/secrets)
# PLR0913: too-many-arguments (FastAPI endpoint dependency injection and rich game domain models)
# PLR0917: too-many-positional-arguments
ignore = [
    "E501",
    "W291",
    "W292",
    "W293",
    "B008",
    "PLR2004",
    "PLC0415",
    "UP045",
    "S311",
    "PLR0913",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Tests allow assert, hardcoded test passwords/tokens, and unused fixture args
"tests/*" = ["S101", "S105", "S106", "ARG001", "F841", "PLR0133", "N802", "N806"]
"alembic/*" = ["C901", "PLR0912", "PLR0915", "UP007", "UP035"]
"backend/api/routes/adventures/gameplay_logic.py" = ["E701", "I001", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1714"]
"backend/engine/scripting/sandbox.py" = ["N802", "N815", "C901", "PLR0911"]
"backend/core/prompts.py" = ["S608"]
"scripts/*" = ["C901", "PLR0912", "PLR0915", "E402", "S603", "S607"]

# Allow fixable violations to be fixed automatically
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 12
max-returns = 6
max-statements = 50

[tool.mypy]
python_version = "3.10"
exclude = [
    "venv",
    "alembic",
    "backend/brain/.*/scratch",
    "D:/_pyrefly_virtual_",
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "aiosqlite.*",
    "litellm.*",
    "alembic.*",
    "passlib.*",
    "jose.*"
]
ignore_missing_imports = true
